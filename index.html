<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بررسی صحت کد ملی</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 24px 16px;
        font-family: Tahoma, "Vazirmatn", sans-serif;
        background: #f3f5f9;
        color: #1f2937;
    }
    .container {
        max-width: 480px;
        margin: 0 auto;
        background: #fff;
        border-radius: 14px;
        padding: 28px 24px;
        box-shadow: 0 4px 18px rgba(0,0,0,.08);
        text-align: center;
    }
    .logo-wrap { margin-bottom: 6px; }
    .logo-wrap img { width: 170px; max-width: 60%; height: auto; }
    h2 { margin: 8px 0 20px; font-size: 22px; color: #20578c; }
    h3 { margin: 0 0 12px; font-size: 17px; }
    input[type="text"] {
        width: 100%;
        padding: 12px;
        font-size: 18px;
        text-align: center;
        letter-spacing: 3px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        direction: ltr;
    }
    input[type="text"]:focus { outline: 2px solid #93c5fd; border-color: #3b82f6; }
    button {
        margin-top: 12px;
        padding: 11px 20px;
        font-size: 15px;
        font-family: inherit;
        color: #fff;
        background: #20578c;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }
    button:hover { background: #17446f; }
    button.orange { background: #f59300; }
    button.orange:hover { background: #d98000; }
    button.light { background: #e2e8f0; color: #1f2937; }
    button.light:hover { background: #cbd5e1; }
    #result { min-height: 24px; margin: 14px 0 0; font-weight: bold; }
    hr { border: none; border-top: 1px solid #e5e7eb; margin: 26px 0; }
    #generated {
        margin-top: 16px;
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 4px;
        direction: ltr;
        min-height: 36px;
        user-select: all;
        -webkit-user-select: all;
    }
    #genType { font-size: 12px; color: #6b7280; min-height: 18px; }
    #copyMsg { font-size: 13px; min-height: 20px; margin: 6px 0 0; }
    .note { font-size: 12px; color: #6b7280; margin-top: 14px; }
</style>
</head>

    <h2>بررسی صحت کد ملی</h2>

    <input
        type="text"
        id="nationalCode"
        maxlength="10"
        inputmode="numeric"
        placeholder="کد ملی را وارد کنید"
    >

    <button onclick="checkNationalCode()">بررسی کد ملی</button>

    <p id="result"></p>

    <hr>

    <h3>ساخت کد ملی</h3>
    <button onclick="generateNationalCode('random')">تولید کد ملی تصادفی</button>
    <button class="orange" onclick="generateNationalCode('round')">تولید کد ملی رند</button>

    <div id="generated"></div>
    <div id="genType"></div>

    <div id="actions" style="display:none">
        <button class="light" onclick="copyGenerated()">کپی</button>
        <button class="light" onclick="useGenerated()">بررسی این کد</button>
    </div>
    <p id="copyMsg"></p>

    <p class="note">کدهای تولیدشده فقط از نظر الگوریتم (رقم کنترل) معتبرند و متعلق به شخص خاصی نیستند.</p>

</div>

<script>
var lastGenerated = "";

// تبدیل ارقام فارسی و عربی به انگلیسی
function normalizeDigits(str) {
    return str.toString()
        .replace(/[۰-۹]/g, function (d) { return d.charCodeAt(0) - 1776; })
        .replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 1632; });
}

function validateNationalCode(code) {
    code = normalizeDigits(code).replace(/\D/g, '');

    if (code.length !== 10) {
        return false;
    }

    // جلوگیری از کدهای تکراری مثل 1111111111
    if (/^(\d)\1{9}$/.test(code)) {
        return false;
    }

    var sum = 0;

    for (var i = 0; i < 9; i++) {
        sum += parseInt(code[i]) * (10 - i);
    }

    var remainder = sum % 11;
    var control = parseInt(code[9]);

    if (remainder < 2) {
        return control === remainder;
    }

    return control === 11 - remainder;
}

function checkNationalCode() {
    var code = document.getElementById("nationalCode").value;
    var result = document.getElementById("result");

    if (validateNationalCode(code)) {
        result.innerHTML = "✅ کد ملی معتبر است";
        result.style.color = "green";
    } else {
        result.innerHTML = "❌ کد ملی نامعتبر است";
        result.style.color = "red";
    }
}

/* ---------- تولید کد ملی ---------- */

function randInt(n) {
    return Math.floor(Math.random() * n);
}

// محاسبه رقم کنترل برای ۹ رقم اول
function controlDigit(nine) {
    var sum = 0;
    for (var i = 0; i < 9; i++) {
        sum += parseInt(nine[i]) * (10 - i);
    }
    var r = sum % 11;
    return r < 2 ? r : 11 - r;
}

function isUsable(code) {
    return code.length === 10 &&
           !/^(\d)\1{9}$/.test(code) &&
           code.substring(0, 3) !== '000' &&
           validateNationalCode(code);
}

// کد ملی تصادفی
function createRandomCode() {
    var code;
    do {
        var nine = '';
        for (var i = 0; i < 9; i++) nine += randInt(10);
        code = nine + controlDigit(nine);
    } while (!isUsable(code));
    return code;
}

// کد ملی رند (الگودار): ارقام تکراری، متوالی، متقارن و ...
function createRoundCode() {
    var patterns = [
        // یک رقم تکراری: 222222222
        function () { var d = 1 + randInt(9); return new Array(10).join(d); },
        // متوالی صعودی: 123456789 ، 345678901
        function () { var s = randInt(10), r = ''; for (var i = 0; i < 9; i++) r += (s + i) % 10; return r; },
        // متوالی نزولی: 987654321
        function () { var s = randInt(10), r = ''; for (var i = 0; i < 9; i++) r += ((s - i) % 10 + 10) % 10; return r; },
        // دو رقم تکراری: 121212121
        function () { var a = randInt(10), b = randInt(10), r = ''; for (var i = 0; i < 9; i++) r += (i % 2 ? b : a); return r; },
        // سه رقم تکراری: 123123123
        function () { var t = '' + randInt(10) + randInt(10) + randInt(10); return t + t + t; },
        // متقارن: 123454321
        function () { var h = ''; for (var i = 0; i < 4; i++) h += randInt(10); var m = randInt(10); return h + m + h.split('').reverse().join(''); },
        // بلوک‌های سه‌تایی: 111222333
        function () { return new Array(4).join(randInt(10)) + new Array(4).join(randInt(10)) + new Array(4).join(randInt(10)); },
        // صفرهای انتهایی: 123400000
        function () { var k = 2 + randInt(3), r = ''; for (var i = 0; i < k; i++) r += randInt(10); while (r.length < 9) r += '0'; return r; }
    ];

    var code, tries = 0;
    do {
        var nine = patterns[randInt(patterns.length)]();
        code = nine + controlDigit(nine);
        tries++;
    } while (!isUsable(code) && tries < 500);

    return isUsable(code) ? code : createRandomCode();
}

function generateNationalCode(mode) {
    lastGenerated = (mode === 'round') ? createRoundCode() : createRandomCode();

    document.getElementById("generated").textContent = lastGenerated;
    document.getElementById("genType").textContent = (mode === 'round') ? "کد ملی رند" : "کد ملی تصادفی";
    document.getElementById("actions").style.display = "block";
    document.getElementById("copyMsg").textContent = "";
}

/* ---------- کپی ---------- */

function selectGeneratedText() {
    var el = document.getElementById("generated");
    var range = document.createRange();
    range.selectNodeContents(el);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
}

function copyWithFallback(text, onOk, onFail) {
    try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.left = "0";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) { onOk(); } else { onFail(); }
    } catch (e) {
        onFail();
    }
}

function copyGenerated() {
    var msg = document.getElementById("copyMsg");
    var text = lastGenerated;   // همیشه همان کد تولیدشده، نه چیز دیگری

    if (!text) return;

    function ok() {
        msg.textContent = "✓ کد " + text + " کپی شد";
        msg.style.color = "green";
    }
    function fail() {
        selectGeneratedText();
        msg.textContent = "کپی خودکار انجام نشد؛ کد انتخاب شد، با Ctrl+C کپی کنید.";
        msg.style.color = "red";
    }

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(ok, function () {
            copyWithFallback(text, ok, fail);
        });
    } else {
        copyWithFallback(text, ok, fail);
    }
}

function useGenerated() {
    document.getElementById("nationalCode").value = lastGenerated;
    checkNationalCode();
}
</script>
